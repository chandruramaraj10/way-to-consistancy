<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Way to Consistency</title>
<link rel="icon" type="image/png" href="assets/brand-logo.png">
<style>
@font-face{font-family:'Poppins';font-weight:500;font-style:normal;font-display:swap;src:url('assets/fonts/poppins-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Poppins';font-weight:600;font-style:normal;font-display:swap;src:url('assets/fonts/poppins-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Poppins';font-weight:700;font-style:normal;font-display:swap;src:url('assets/fonts/poppins-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:400;font-style:normal;font-display:swap;src:url('assets/fonts/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:500;font-style:normal;font-display:swap;src:url('assets/fonts/inter-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:600;font-style:normal;font-display:swap;src:url('assets/fonts/inter-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-style:normal;font-display:swap;src:url('assets/fonts/inter-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'DM Mono';font-weight:400;font-style:normal;font-display:swap;src:url('assets/fonts/dm-mono-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Kaushan Script';font-weight:400;font-style:normal;font-display:swap;src:url('assets/fonts/kaushan-script-latin-400-normal.woff2') format('woff2')}
/* Layout: a glass left rail on wide screens and a bottom tab bar on phones, floating over a full-bleed background (a scene per theme, or the user's own picture). Cards are translucent glass so any background stays readable. */
:root{
  --font-display:'Poppins','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#eef3fa; --surface:rgba(255,255,255,.9); --surface-solid:#ffffff; --surface2:rgba(18,40,90,.07); --input:rgba(18,40,90,.05);
  --fg:#0f1f3d; --muted:#4f5e7c; --line:rgba(18,40,90,.14);
  --a:#1d5fd1; --a-d:#86b6ff; --accent:var(--a); --on-accent:#ffffff;
  --good:#1a8a3c; --warn:#9a5a00; --bad:#c62828; --info:#2f6fe4; --gold:#b57400;
  --scrim-rgb:255,255,255;
  --shadow:0 1px 2px rgba(15,31,61,.06),0 12px 32px rgba(15,31,61,.09);
  --scale:1; --dim:0; --bg-blur:0px; --bg-art:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020; --surface:rgba(20,26,46,.88); --surface-solid:#171d33; --surface2:rgba(255,255,255,.08); --input:rgba(255,255,255,.07);
    --fg:#eaf0ff; --muted:#a3afd0; --line:rgba(255,255,255,.14);
    --accent:var(--a-d); --on-accent:#08102a; --good:#4ade80; --warn:#fbbf24; --bad:#ff8a8a; --info:#7db4ff; --gold:#ffc24d;
    --scrim-rgb:5,8,20; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:rgba(20,26,46,.88); --surface-solid:#171d33; --surface2:rgba(255,255,255,.08); --input:rgba(255,255,255,.07);
  --fg:#eaf0ff; --muted:#a3afd0; --line:rgba(255,255,255,.14);
  --accent:var(--a-d); --on-accent:#08102a; --good:#4ade80; --warn:#fbbf24; --bad:#ff8a8a; --info:#7db4ff; --gold:#ffc24d;
  --scrim-rgb:5,8,20; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
  color-scheme:dark;
}
/* the four dark-by-design themes commit to their own look in every mode */
:root[data-skin="nature"]{
  --bg:#0a1a10; --surface:rgba(14,38,26,.58); --surface-solid:#10281b; --surface2:rgba(255,255,255,.09); --input:rgba(255,255,255,.08);
  --fg:#eaf7ee; --muted:#a8c9b3; --line:rgba(190,255,215,.18); --accent:#62d884; --on-accent:#05200e;
  --good:#6ee79a; --warn:#fbc54d; --bad:#ff8f8f; --info:#7cc4ff; --gold:#ffcf5a; --scrim-rgb:4,16,9;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.35); color-scheme:dark;
}
:root[data-skin="gaming"]{
  --bg:#070d1f; --surface:rgba(11,20,46,.58); --surface-solid:#0f1a3a; --surface2:rgba(130,170,255,.1); --input:rgba(130,170,255,.09);
  --fg:#e9efff; --muted:#a2b0dc; --line:rgba(120,165,255,.26); --accent:#3d7dff; --on-accent:#ffffff;
  --good:#4ade80; --warn:#ffb83d; --bad:#ff7a8c; --info:#7db4ff; --gold:#ffbe3d; --scrim-rgb:4,8,22;
  --shadow:0 0 0 1px rgba(80,130,255,.12),0 14px 34px rgba(0,0,0,.45); color-scheme:dark;
}
:root[data-skin="car"]{
  --bg:#130709; --surface:rgba(34,12,16,.6); --surface-solid:#260d12; --surface2:rgba(255,120,120,.1); --input:rgba(255,120,120,.08);
  --fg:#fdeeee; --muted:#d3a8ad; --line:rgba(255,120,120,.26); --accent:#ff4a4a; --on-accent:#2a0508;
  --good:#58e08c; --warn:#ffb340; --bad:#ff8585; --info:#7db4ff; --gold:#ffb340; --scrim-rgb:16,3,6;
  --shadow:0 0 0 1px rgba(255,80,80,.12),0 14px 34px rgba(0,0,0,.5); color-scheme:dark;
}
:root[data-skin="space"]{
  --bg:#0a0720; --surface:rgba(26,15,64,.58); --surface-solid:#1a1040; --surface2:rgba(190,160,255,.11); --input:rgba(190,160,255,.09);
  --fg:#f0ecff; --muted:#b8aee3; --line:rgba(170,140,255,.28); --accent:#9b72ff; --on-accent:#120830;
  --good:#5eead4; --warn:#ffc65c; --bad:#ff8aa6; --info:#8cc0ff; --gold:#ffc65c; --scrim-rgb:6,3,20;
  --shadow:0 0 0 1px rgba(150,110,255,.14),0 14px 34px rgba(0,0,0,.5); color-scheme:dark;
}

:root[data-skin="shadow"]{
  --bg:#0c0809; --surface:rgba(24,16,18,.62); --surface-solid:#1b1214; --surface2:rgba(255,255,255,.08); --input:rgba(255,255,255,.07);
  --fg:#f4ecea; --muted:#bfaaa6; --line:rgba(255,255,255,.16); --accent:#e03a3a; --on-accent:#ffffff;
  --good:#58e08c; --warn:#ffb340; --bad:#ff8585; --info:#7db4ff; --gold:#d9b25a; --scrim-rgb:8,4,5;
  --font-script:'Kaushan Script','Brush Script MT',cursive;
  --shadow:0 0 0 1px rgba(224,58,58,.14),0 14px 34px rgba(0,0,0,.55); color-scheme:dark;
}

*{box-sizing:border-box}
html{font-size:calc(15px * var(--scale))}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 75%,var(--fg));outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--font-display);line-height:1.2;margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* background layers */
#bgLayer{position:fixed;inset:0;z-index:0;background-color:var(--bg);background-image:var(--bg-art);background-size:cover;background-position:center;transform:scale(1.06);filter:blur(var(--bg-blur));pointer-events:none}
#bgScrim{position:fixed;inset:0;z-index:0;background:rgba(var(--scrim-rgb),var(--dim));pointer-events:none}

/* shell */
.app{position:relative;z-index:1;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:18px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-family:var(--font-display);font-weight:700;font-size:1.05rem;line-height:1.15}
.brand-mark{width:40px;height:40px;position:relative;overflow:hidden;display:block;flex:none;border-radius:50%;background:#07122e;border:1px solid var(--line)}
.brand .logo{position:absolute;width:75px;height:75px;max-width:none;left:-17.5px;top:-10px;object-fit:cover}
.brand-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand-copy b{font-weight:700}
.brand-copy small{font-family:var(--font-body);font-size:.68rem;line-height:1.2;color:var(--muted);font-weight:500}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:500;text-align:left;min-height:44px}
.nav-btn svg,.tab svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover{background:var(--surface2);color:var(--fg)}
.nav-btn[aria-current="page"]{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--fg);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav-btn[aria-current="page"] svg{color:var(--accent)}
.rail .spacer{flex:1}
.usercard{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--surface2);border:0;text-align:left;width:100%;margin-top:8px}
.usercard b{display:block;font-size:.92rem;line-height:1.2}
.usercard small{color:var(--muted)}
.save-state{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.78rem;min-height:32px;padding:4px 10px}
.save-state::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.save-state[data-state="saving"]::before{background:var(--warn);animation:pulse 1s ease-in-out infinite}
.save-state[data-state="unavailable"]::before{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.tabbar{display:none}
main{min-width:0;padding-block:24px 120px;padding-inline:clamp(16px,3vw,36px);max-width:1180px;width:100%;margin-inline:auto}
.topbar{display:none}
.page{display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head h1{font-size:clamp(1.5rem,4.5vw,2.1rem);font-weight:700}
.sub{color:var(--muted);font-size:.93rem}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card.flat{box-shadow:none}
.card h2{font-size:1.08rem;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .grow{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:10px}
.rowf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rowf .grow{flex:1;min-width:0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface-solid);font-weight:600;transition:transform .12s,background .15s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.68}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 86%,var(--fg))}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.small{min-height:36px;padding:0 12px;font-size:.9rem;border-radius:10px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-solid);display:grid;place-items:center;font-size:1.1rem}
.iconbtn:hover{background:var(--surface2)}
.iconbtn.sm{width:36px;height:36px;border-radius:10px;font-size:1rem}
.iconbtn:disabled{opacity:.4;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl-t{font-size:.76rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=month],input[type=search],select,textarea{width:100%;min-height:44px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--input);min-width:0}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
select option{background:var(--surface-solid);color:var(--fg)}
.check-row{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500}
.form{display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface2);flex-wrap:wrap}
.seg button{min-height:38px;padding:0 14px;border:0;border-radius:10px;background:transparent;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface-solid);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-solid);font-weight:500}
.chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:500;background:color-mix(in srgb,var(--c,var(--accent)) 20%,transparent);border:1px solid color-mix(in srgb,var(--c,var(--accent)) 45%,var(--line))}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid transparent;background:var(--sw);box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed="true"]{border-color:var(--surface-solid);box-shadow:0 0 0 3px var(--fg)}
label:has(> input.sr:focus-visible) > span,label.chipbtn:has(input.sr:focus-visible){outline:3px solid color-mix(in srgb,var(--accent) 75%,var(--fg));outline-offset:2px}
label.btn:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 75%,var(--fg))}
.seg-l{display:inline-flex}
.emoji-grid{display:flex;flex-wrap:wrap;gap:6px}
.emoji-grid button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-solid);font-size:1.2rem}
.emoji-grid button:hover{background:var(--surface2)}

/* theme cards */
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.themecard{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:128px;padding:0;border-radius:16px;overflow:hidden;border:2px solid var(--line);text-align:left;background:#000;color:#fff}
.themecard .tc-art{position:absolute;inset:0;background-size:cover;background-position:center}
.themecard::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0) 65%)}
.themecard .tc-t,.themecard .tc-s{position:relative;z-index:1;padding:0 12px}
.themecard .tc-t{font-family:var(--font-display);font-weight:600}
.themecard .tc-s{font-size:.78rem;opacity:.9;padding-bottom:10px}
.themecard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 55%,transparent)}
.themecard[aria-pressed="true"] .tc-t::after{content:" ✓"}
.bgprev{height:130px;border-radius:16px;border:1px solid var(--line);background-size:cover;background-position:center;position:relative;overflow:hidden}
.bgprev i{position:absolute;inset:0;background:rgba(var(--scrim-rgb),var(--dim));backdrop-filter:blur(var(--bg-blur))}

/* tasks */
.orow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.orow:last-child{border-bottom:0}
.orow[draggable="true"]{cursor:grab}
.check{width:32px;height:32px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;font-weight:800;color:var(--on-accent);flex:none;position:relative}
.check::after{content:"";position:absolute;inset:-7px}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#04140a}
.orow-main{flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:4px 0;display:flex;flex-direction:column;gap:2px}
.otitle{font-weight:600;overflow-wrap:anywhere}
.is-done .otitle{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.ometa{font-size:.85rem;color:var(--muted)}
.st{font-size:.78rem;font-weight:600;white-space:nowrap;padding:3px 9px;border-radius:999px;background:var(--surface2)}
.st-done{color:var(--good)}.st-missed{color:var(--bad)}.st-partial,.st-skipped{color:var(--warn)}.st-pending{color:var(--muted)}.st-cancelled{color:var(--muted)}
.prio-high{color:var(--bad);font-weight:600}.prio-med{color:var(--warn)}.prio-low{color:var(--muted)}

/* hero, avatar, widgets */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:center}
.hero-l{display:flex;align-items:center;gap:18px;min-width:0}
.hello{font-size:clamp(1.3rem,3.6vw,1.8rem);font-weight:700}
.quote{font-style:italic;color:var(--muted);font-size:.95rem}
.avatar{position:relative;width:var(--sz,96px);height:var(--sz,96px);flex:none}
.avatar svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.avatar .trk{fill:none;stroke:var(--surface2);stroke-width:5}
.avatar .val{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.avatar .face{position:absolute;inset:9%;border-radius:50%;overflow:hidden;background:color-mix(in srgb,var(--accent) 30%,var(--surface-solid));display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:calc(var(--sz,96px) * .38)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.widget{padding:14px 16px;border-radius:16px;background:var(--surface2);display:flex;flex-direction:column;gap:6px;min-width:0}
.widget .wk{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.widget .wv{font-family:var(--font-display);font-weight:700;font-size:1.7rem;line-height:1.1}
.widget .wv small{font-size:.9rem;color:var(--muted);font-weight:500}
.widget .row2{display:flex;align-items:center;gap:14px}
.gauge{width:130px;height:auto;flex:none}
.gauge .trk{fill:none;stroke:var(--surface2);stroke-width:9;stroke-linecap:round}
.gauge .val{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .8s}
.gauge .needle{stroke:var(--fg);stroke-width:3;stroke-linecap:round}
.gauge circle.hub{fill:var(--fg)}
.orbit{width:112px;height:112px;flex:none}
.orbit .ring{fill:none;stroke:var(--surface2);stroke-width:5}
.orbit .val{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.plant{font-size:3rem;line-height:1}
.meter{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .6s}
.meter.xp i{background:linear-gradient(90deg,var(--gold),var(--accent))}
.meter.warn i{background:var(--warn)}.meter.bad i{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.stat{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0;backdrop-filter:blur(14px)}
.stat .si{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:color-mix(in srgb,var(--c,var(--accent)) 24%,transparent);flex:none}
.stat .sk{font-size:.76rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .sv{font-family:var(--font-display);font-weight:700;font-size:1.35rem;line-height:1.15;overflow-wrap:anywhere}
.tile{padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-width:0;backdrop-filter:blur(14px)}
.tile .k{font-size:.76rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--font-display);font-weight:700;font-size:1.45rem;margin-top:4px;overflow-wrap:anywhere}
.tile .n{font-size:.85rem;color:var(--muted);margin-top:2px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.strip{text-align:center;color:var(--muted);font-size:.9rem;letter-spacing:.04em;padding:6px 0}
.habit{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:0}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots span{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:.75rem;font-weight:800;background:var(--surface2);color:var(--muted)}
.dots .d-done{background:var(--good);color:#04140a}.dots .d-missed{background:color-mix(in srgb,var(--bad) 28%,transparent);color:var(--bad)}.dots .d-skipped,.dots .d-partial{color:var(--warn)}
.streak{font-family:var(--font-mono);font-weight:500;white-space:nowrap}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:color-mix(in srgb,var(--warn) 16%,var(--surface-solid));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));font-size:.92rem}
.banner .grow{flex:1;min-width:200px}
.empty{padding:26px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty .big{font-size:2.4rem}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa .btn{justify-content:flex-start}

/* mini calendar */
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.mini .wd{font-size:.68rem;color:var(--muted);font-weight:600;padding:2px 0}
.mini button{position:relative;aspect-ratio:1;min-height:30px;max-height:42px;border:0;border-radius:10px;background:transparent;font-size:.82rem;font-weight:500;display:grid;place-items:center}
.mini button:hover{background:var(--surface2)}
.mini button.today{background:var(--accent);color:var(--on-accent);font-weight:700}
.mini button i{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--muted)}
.mini button i.all{background:var(--good)}.mini button i.some{background:var(--warn)}
.mini button.today i{background:var(--on-accent)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cell{min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--input);padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden}
.cell:hover{background:var(--surface2)}
.cell.out{opacity:.45}
.cell.today .dn{background:var(--accent);color:var(--on-accent)}
.cell.sel{outline:3px solid var(--accent);outline-offset:-1px}
.cell.over{background:color-mix(in srgb,var(--accent) 24%,transparent)}
.dn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:.85rem}
.mk{display:flex;flex-wrap:wrap;gap:2px;font-size:.8rem;font-weight:800;line-height:1.1}
.mk .m-done{color:var(--good)}.mk .m-missed{color:var(--bad)}.mk .m-partial,.mk .m-skipped{color:var(--warn)}.mk .m-pending{color:var(--muted)}
.wk-item{font-size:.78rem;padding:2px 5px;border-radius:6px;background:var(--surface2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.92rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent)}.chart .axis{stroke:var(--line);stroke-width:1}
.chart .t{fill:var(--muted);font:10px var(--font-mono)}.chart .tv{fill:var(--fg);font:600 10px var(--font-mono)}
.donut{width:170px;height:170px;flex:none}
.donut circle{fill:none;stroke-width:6}
.donut .trk{stroke:var(--surface2)}
.donut text{fill:var(--fg);font:700 5.2px var(--font-display);text-anchor:middle}
.donut text.s{fill:var(--muted);font:400 2.6px var(--font-body)}
.catrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.ce{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 26%,transparent);font-size:1.15rem;flex:none}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .amt{font-family:var(--font-mono);font-weight:500;white-space:nowrap}
.sugg{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface2)}

/* journey */
.jhero{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumb{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;background:linear-gradient(to top,rgba(0,0,0,.78),transparent);color:#fff;font-size:.75rem;text-align:left}
.thumb .badge{position:absolute;top:6px;right:6px;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.75rem;font-weight:700}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:var(--surface2)}
.cmp figcaption{font-size:.85rem;color:var(--muted)}
.ci-prev{min-height:180px;border-radius:16px;border:1px dashed var(--line);display:grid;place-items:center;background:var(--input);overflow:hidden}
.ci-prev img{max-width:100%;max-height:300px;display:block}
.camv{width:100%;max-height:60vh;border-radius:16px;background:#000;transform:scaleX(-1)}
.bigphoto{width:100%;max-height:60vh;object-fit:contain;border-radius:16px;background:#000;display:block}
.wave{display:flex;align-items:center;gap:3px;height:44px}
.wave span{width:4px;height:40%;border-radius:3px;background:var(--accent);opacity:.5}
.wave.on span{opacity:1;animation:wv .8s ease-in-out infinite;animation-delay:calc(var(--i) * 55ms)}
@keyframes wv{0%,100%{height:15%}50%{height:95%}}
.task-options{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.task-options legend{font-weight:700;padding-inline:5px}
.task-progress{display:flex;flex-direction:column;gap:8px}
.reference-panel{border-top:1px solid var(--line);padding-top:12px}
.reference-panel summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600;color:var(--fg)}
.reference-panel img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;border-radius:8px;background:var(--surface2)}
:root[data-contrast="high"]{--surface:var(--surface-solid);--surface2:color-mix(in srgb,var(--fg) 12%,var(--surface-solid));--input:var(--surface-solid);--line:color-mix(in srgb,var(--fg) 30%,transparent);--dim:.78;--bg-blur:4px}
:root[data-contrast="high"] .card,:root[data-contrast="high"] .rail,:root[data-contrast="high"] .topbar,:root[data-contrast="high"] .tabbar{backdrop-filter:none;-webkit-backdrop-filter:none}

/* overlays */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);font-size:2rem;font-weight:500;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 45%,transparent);z-index:20;transition:transform .15s}
.fab:hover{transform:rotate(90deg) scale(1.05)}
.scrim{position:fixed;inset:0;background:rgba(5,8,20,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{width:min(660px,100%);max-height:92vh;overflow:auto;background:var(--surface-solid);border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);animation:up .22s ease}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h2{flex:1;font-size:1.25rem}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.toasts{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;padding-inline:16px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:var(--fg);color:var(--bg);box-shadow:var(--shadow);max-width:min(440px,100%);animation:up .2s ease;font-weight:500}
.toast button{background:transparent;border:0;color:inherit;font-weight:800;text-decoration:underline;min-height:32px}
.remind{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:70;pointer-events:none;padding-inline:16px}
.rcard{pointer-events:auto;width:min(460px,100%);padding:16px;border-radius:20px;background:var(--surface-solid);border:2px solid var(--accent);box-shadow:var(--shadow);animation:drop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-30px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.rcard h3{font-size:1.05rem;margin-bottom:4px}
.pop{position:fixed;z-index:80;pointer-events:none;font-size:1.6rem;will-change:transform,opacity}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list .btn{justify-content:flex-start;min-height:52px;font-size:1.02rem}
.menu-list .btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hist{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;margin-top:8px}
textarea.export{font-family:var(--font-mono);font-size:.78rem;min-height:200px;white-space:pre}

@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .split{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;padding:10px 16px;background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0;flex:1;font-size:1rem}
  .topbar .brand-mark{width:34px;height:34px}
  .topbar .brand .logo{width:64px;height:64px;left:-15px;top:-9px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:var(--muted);min-height:52px;border-radius:12px;font-size:.7rem;font-weight:600}
  .tabbar button[aria-current="page"]{color:var(--fg);background:color-mix(in srgb,var(--accent) 22%,transparent)}
  .tabbar button[aria-current="page"] svg{color:var(--accent)}
  .fab{bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px}
  .toasts{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .cell{min-height:58px;padding:4px}
  .wk-item{display:none}
  main{padding-top:16px}
}
@media (min-width:821px){
  .scrim{align-items:center;padding:20px}
  .sheet{border-radius:24px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .fab:hover{transform:none}
}

/* ===== design-sheet look: icon badges, mission rows, showcase cards, theme emblems ===== */
.ibadge{--c:var(--accent);width:var(--bs,46px);height:var(--bs,46px);border-radius:30%;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 70%,#000));box-shadow:0 6px 14px color-mix(in srgb,var(--c) 38%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.ibadge svg{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibadge.round{border-radius:50%}
.stat .si{background:none;font-size:0;width:auto;height:auto;display:block}
.stat{position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent)}
.stat .sv{font-size:1.5rem}
:root[data-skin="shadow"] h1,:root[data-skin="shadow"] .hello,:root[data-skin="shadow"] .brand-copy b{font-family:var(--font-script);font-weight:400;letter-spacing:.01em}
:root[data-skin="shadow"] .hello{font-size:clamp(1.6rem,4.4vw,2.2rem)}
.hero{position:relative;overflow:hidden}
.hero .emblem{position:absolute;right:-6px;top:-6px;width:120px;height:120px;border-radius:0 20px 0 60px;background:#e9eef6 center/contain no-repeat;opacity:.95;mix-blend-mode:normal;display:none}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .mi{--c:var(--accent);width:42px;height:42px;border-radius:30%;display:grid;place-items:center;font-size:1.25rem;flex:none;background:color-mix(in srgb,var(--c) 26%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.mrow .mm{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;text-align:left;background:transparent;border:0;padding:0}
.mrow .mt{font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.mrow.is-done .mt{text-decoration:line-through;color:var(--muted)}
.mrow .meter{height:8px}
.mrow .mp{font-family:var(--font-mono);font-size:.8rem;color:var(--muted);white-space:nowrap;min-width:3.2em;text-align:right}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qtile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border-radius:16px;border:1px solid var(--line);background:var(--surface2);font-weight:600;font-size:.82rem;min-height:84px;justify-content:center;text-align:center}
.qtile:hover{background:color-mix(in srgb,var(--accent) 16%,var(--surface2))}
.qtile .ibadge{--bs:36px}
.showcase{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.scard{position:relative;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;overflow:hidden;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.scard h3{font-size:1rem;display:flex;align-items:center;gap:10px}
.scard .hbar{display:flex;flex-direction:column;gap:5px}
.scard .hbar .l{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.scard .big{font-family:var(--font-display);font-weight:700;font-size:2.4rem;line-height:1}
.bars{display:flex;align-items:flex-end;gap:6px;height:64px}
.bars i{flex:1;border-radius:5px 5px 2px 2px;background:linear-gradient(to top,color-mix(in srgb,var(--accent) 55%,transparent),var(--accent));min-height:4px}
.mring{width:84px;height:84px;flex:none}
.mring .trk{fill:none;stroke:var(--surface2);stroke-width:9}
.mring .val{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round}
.mring text{fill:var(--fg);font:700 22px var(--font-display);text-anchor:middle}
.tagbar{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tagbar b{font-family:var(--font-display);font-weight:600}
.tagbar .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
:root[data-skin="shadow"] .tagbar b{font-family:var(--font-script);font-weight:400;font-size:1.15rem}
/* theme emblem cards, like the "Logos & Themes" row of the design sheet */
.themes{grid-template-columns:repeat(auto-fit,minmax(138px,1fr))}
.themecard{min-height:0;background:var(--surface-solid);color:var(--fg);justify-content:flex-start;border-radius:18px}
.themecard::after{display:none}
.themecard .tc-art{position:relative;inset:auto;display:block;height:92px;background:#eef2f9 center/contain no-repeat;background-origin:content-box;padding:8px}
.themecard .tc-t{padding:9px 12px 0;display:block}
.themecard .tc-s{padding:2px 12px 10px;display:block;color:var(--muted);opacity:1}
/* about card */
.about{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.about img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.plat{display:flex;gap:8px;flex-wrap:wrap}
.plat span{padding:4px 12px;border-radius:999px;font-size:.8rem;font-weight:600;border:1px solid var(--line);background:var(--surface2)}
/* belt widget */
.belt{display:flex;align-items:center;gap:12px}
.belt .bt{height:14px;flex:1;border-radius:4px;background:linear-gradient(90deg,var(--bc),color-mix(in srgb,var(--bc) 60%,#000))}
.profchip{display:none}
@media (max-width:820px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{padding:12px;gap:10px}.stat .sv{font-size:1.2rem}
  .topbar .brand-copy small{display:none}
  .hero-l{flex-direction:column;align-items:flex-start}
  .profchip{display:flex;align-items:center;gap:8px;border:0;background:var(--surface2);padding:4px 10px 4px 4px;border-radius:999px;font-weight:600;font-size:.82rem}
  .qgrid{grid-template-columns:repeat(3,1fr)}
}

/* ===== v3: per-theme header, solid quick buttons, theme showcase cards, photo backgrounds ===== */
.thead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:2px 2px 0}
.thead .tt{font-size:clamp(1.3rem,3.6vw,1.8rem);font-weight:700;line-height:1.1}
.thead .ts{color:var(--muted);font-size:.92rem}
.thead .tuser{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:600;font-size:.9rem}
.thead .tuser small{display:block;color:var(--muted);font-weight:500;font-size:.72rem}
:root[data-skin="shadow"] .thead .tt{font-family:var(--font-script);font-weight:400;font-size:clamp(1.6rem,4.2vw,2.2rem)}
.qbtns{display:flex;flex-direction:column;gap:10px}
.qbtn{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid color-mix(in srgb,var(--accent) 60%,#fff 10%);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));color:var(--on-accent);font-weight:700;box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.qbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

<script>
/* Pure calculation rules. No DOM, no storage, so the same rule gives the same answer everywhere. */
//#CALC-START
const Calc = {
  pct(n, d){ return d > 0 ? (n / d) * 100 : 0; },
  // statuses: done, partial, skipped, cancelled, missed, pending (pending = not yet due)
  tally(statuses){
    const t = {done:0, partial:0, skipped:0, cancelled:0, missed:0, pending:0};
    for (const s of statuses){ if (s in t) t[s]++; }
    return t;
  },
  // Eligible = done + partial + missed (+ skipped only if the user chose that). Cancelled and not-yet-due are excluded.
  completionRate(t, o){
    o = o || {};
    const credit = o.partialCredit || 0;
    const eligible = t.done + t.partial + t.missed + (o.skippedCounts ? t.skipped : 0);
    if (!eligible) return null;
    return ((t.done + credit * t.partial) / eligible) * 100;
  },
  // Streak: consecutive scheduled occurrences completed, newest first. Skipped, cancelled and not-yet-due do not break it.
  streak(statuses){
    let n = 0;
    for (let i = statuses.length - 1; i >= 0; i--){
      const s = statuses[i];
      if (s === 'pending' || s === 'skipped' || s === 'cancelled') continue;
      if (s === 'done') n++; else break;
    }
    return n;
  },
  // Best streak: the longest run of completed occurrences, with the same neutral statuses as streak().
  bestStreak(statuses){
    let best = 0, cur = 0;
    for (const s of statuses){
      if (s === 'pending' || s === 'skipped' || s === 'cancelled') continue;
      if (s === 'done'){ cur++; if (cur > best) best = cur; } else cur = 0;
    }
    return best;
  },
  monthTotals(inc, exp){
    const income = inc.filter(i => i.actual !== false).reduce((s, i) => s + i.amount, 0);
    const expected = inc.filter(i => i.actual === false).reduce((s, i) => s + i.amount, 0);
    let spent = 0, saved = 0;
    for (const e of exp){
      if (e.kind === 'refund') spent -= e.amount;
      else if (e.kind === 'saving') saved += e.amount;
      else spent += e.amount;
    }
    return {income, expected, spent, saved, remainder: income - spent - saved, savingsRate: income > 0 ? (saved / income) * 100 : null};
  },
  byCategory(exp){
    const m = {};
    for (const e of exp){
      if (e.kind === 'saving') continue;
      m[e.catId] = (m[e.catId] || 0) + (e.kind === 'refund' ? -e.amount : e.amount);
    }
    return m;
  },
  budget(spent, limit){
    if (!(limit > 0)) return null;
    return {used: (spent / limit) * 100, remaining: Math.max(limit - spent, 0), over: Math.max(spent - limit, 0)};
  },
  points(cur, prev){ return (cur == null || prev == null) ? null : cur - prev; },
  crossed(before, after, thresholds){ return thresholds.filter(t => before < t && after >= t); }
};
//#CALC-END
</script>
<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const dowOf = s => pd(s).getDay();
const diffDays = (a, b) => { const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number); return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 864e5); };
const dtOf = (s, t) => { const [y, m, d] = s.split('-').map(Number); const [hh, mm] = (t || '00:00').split(':').map(Number); return new Date(y, m - 1, d, hh, mm); };
const monthOf = s => s.slice(0, 7);
const addMonths = (m, n) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const monthLabel = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString(undefined, {month: 'long', year: 'numeric'}); };
const monthShort = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString(undefined, {month: 'short'}); };
const dayLabel = s => pd(s).toLocaleDateString(undefined, {weekday: 'short', day: 'numeric', month: 'short'});
const daysInMonth = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const clampDay = (m, d) => m + '-' + pad(Math.min(d, daysInMonth(m)));
const tzName = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'local'; } catch (e) { return 'local'; } };

const PALETTE = ['#0a7c7c', '#c93f0c', '#8a2cb0', '#1f7a36', '#c4235c', '#2b5fd9', '#b07d00', '#6b7280', '#e0334f', '#0e8fc4'];
const CURRENCIES = ['INR', 'USD', 'EUR', 'GBP', 'JPY', 'AUD', 'CAD', 'AED', 'SGD'];
const ST = {
  done: {i: '✓', l: 'Done'}, partial: {i: '◐', l: 'Partial'}, pending: {i: '●', l: 'Pending'},
  missed: {i: '✕', l: 'Missed'}, skipped: {i: '⏭', l: 'Skipped'}, cancelled: {i: '⊘', l: 'Cancelled'}
};
const PRAISE = ['Nice one!', 'Boom, done!', 'Look at you go!', 'Another one down!', 'Consistency wins!', 'Smooth work!', 'That is how it is done!'];
const PRAISE_E = ['🎉', '🔥', '🚀', '⭐', '💪', '🌟', '🙌'];
const TONES = {
  chime: {label: 'Chime', e: '🔔', n: [[880, 0, .18], [1175, .18, .18], [1568, .36, .4]]},
  bell: {label: 'Bell', e: '🛎️', n: [[660, 0, 1], [990, 0, .7], [1320, 0, .4]]},
  pulse: {label: 'Pulse', e: '💓', n: [[520, 0, .12], [520, .22, .12], [520, .44, .12]]},
  rise: {label: 'Rise', e: '🌅', n: [[440, 0, .14], [554, .14, .14], [659, .28, .14], [880, .42, .35]]}
};

/* ---------- data ---------- */
const KEY = 'wtc.v1';
let db, memOnly = false, warnedSave = false, saveState = 'saved', syncChannel = null, saveTimer = null;

function defaultDB(){
  const mk = (id, kind, name, emoji, color, order, extra) => Object.assign({id, kind, name, emoji, color, order, archived: false}, extra || {});
  return {
    v: 1,
    profile: {name: '', currency: 'INR', theme: 'system', skin: 'minimal', scale: 1, highContrast: false, confetti: true, volume: .7,
      defaultSound: 'tone:chime', lead: 10, snooze: 10, quietOn: false, quietStart: '22:00', quietEnd: '07:00',
      dailySummary: false, summaryTime: '08:00', lastSummary: '', partialCredit: 0, skippedCounts: false,
      thresholds: [50, 80, 100], onboarded: false, sample: false, tz: tzName(),
      bg: {imgId: '', dim: null, blur: 0}, avatarId: '', journeyDay: -1, journeyTime: '09:00', lastJourney: ''},
    cats: [
      mk('c-food', 'expense', 'Food', '🍜', PALETTE[1], 0), mk('c-transport', 'expense', 'Transport', '🚌', PALETTE[5], 1),
      mk('c-bills', 'expense', 'Rent & bills', '🏠', PALETTE[7], 2), mk('c-shop', 'expense', 'Shopping', '🛍️', PALETTE[4], 3),
      mk('c-health', 'expense', 'Health', '💊', PALETTE[3], 4), mk('c-fun', 'expense', 'Fun', '🎬', PALETTE[2], 5),
      mk('c-learn', 'expense', 'Learning', '📚', PALETTE[9], 6), mk('c-other', 'expense', 'Other', '✨', PALETTE[6], 7),
      mk('uncat', 'expense', 'Uncategorized', '🗂️', '#8a8fa6', 99, {system: true}),
      mk('t-work', 'task', 'Work', '💼', PALETTE[5], 0), mk('t-study', 'task', 'Study', '📖', PALETTE[2], 1),
      mk('t-health', 'task', 'Health', '🏃', PALETTE[3], 2), mk('t-home', 'task', 'Home', '🧺', PALETTE[6], 3),
      mk('t-personal', 'task', 'Personal', '🌟', PALETTE[0], 4)
    ],
    tasks: [], occs: [], goals: [], income: [], expenses: [], budgets: [], audio: [], log: [], alerts: {}, checkins: []
  };
}

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw){ db = JSON.parse(raw); migrate(); return; }
  } catch (e) { memOnly = true; }
  db = defaultDB();
}
function migrate(){
  const d = defaultDB();
  db.profile = Object.assign({}, d.profile, db.profile || {});
  for (const k of ['cats', 'tasks', 'occs', 'goals', 'income', 'expenses', 'budgets', 'audio', 'log', 'checkins']) if (!Array.isArray(db[k])) db[k] = d[k];
  if (!db.alerts) db.alerts = {};
  if (!THEMES[db.profile.skin]) db.profile.skin = 'minimal';
  db.profile.bg = Object.assign({imgId: '', dim: null, blur: 0}, db.profile.bg || {});
  if (!db.cats.some(c => c.id === 'uncat')) db.cats.push(d.cats.find(c => c.id === 'uncat'));
}
function updateSaveState(state, text){
  saveState = state || saveState;
  const label = text || (saveState === 'saving' ? 'Saving locally…' : saveState === 'unavailable' ? 'Local storage unavailable' : 'Saved on this device');
  ['railSaveState', 'topSaveState'].forEach(id => {
    const el = document.getElementById(id);
    if (el){ el.dataset.state = saveState; el.textContent = label; }
  });
}
function save(){
  updateSaveState('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveTimer = null;
    try {
      db.updatedAt = Math.max(Date.now(), Number(db.updatedAt || 0) + 1);
      localStorage.setItem(KEY, JSON.stringify(db));
      memOnly = false;
      updateSaveState('saved');
      if (syncChannel) syncChannel.postMessage({key: KEY, updatedAt: db.updatedAt});
      syncNativeReminders();
    }
    catch (e) {
      memOnly = true;
      updateSaveState('unavailable');
      if (!warnedSave){ warnedSave = true; toast('This browser view cannot save data. Export a backup from Settings.', '⚠️'); }
    }
  }, 200);
}
function syncNativeReminders(){
  const bridge = window.AndroidReminders;
  if (!bridge) return;
  const now = Date.now(), reminders = [];
  for (const o of db.occs){
    if (o.status !== 'pending') continue;
    const t = taskById(o.taskId);
    if (!t || t.state !== 'active' || !t.rem || !t.rem.on) continue;
    const base = dtOf(o.date, o.start || o.due || '09:00').getTime();
    const triggerAt = o.snoozeUntil ? new Date(o.snoozeUntil).getTime() : base - (t.rem.lead || 0) * 60000;
    if (triggerAt < now - 20 * 60000) continue;
    reminders.push({id: o.id, title: (t.emoji || '⏰') + ' ' + t.title,
      body: 'Scheduled ' + dayLabel(o.date) + ((o.start || o.due) ? ' at ' + (o.start || o.due) : ''),
      triggerAt, sound: t.rem.sound || 'tone:chime', vibrate: !!t.rem.vibrate,
      quietOn: !!db.profile.quietOn, quietStart: db.profile.quietStart || '22:00', quietEnd: db.profile.quietEnd || '07:00',
      snoozeMinutes: Math.max(1, Number(db.profile.snooze) || 10)});
  }
  try { bridge.syncReminders(JSON.stringify(reminders)); } catch (e) {}
}
function commit(){ save(); render(); }
function applyRemoteSave(raw){
  if (saveTimer !== null) return;
  try {
    const incoming = JSON.parse(raw);
    if (!incoming || !incoming.profile || !Array.isArray(incoming.tasks) || Number(incoming.updatedAt || 0) <= Number(db.updatedAt || 0)) return;
    db = incoming; migrate(); genKey = ''; fmtCache = {}; memOnly = false;
    syncNativeReminders(); render(); updateSaveState('saved', 'Updated from another tab');
    setTimeout(() => updateSaveState('saved'), 2400);
  } catch (e) {}
}
window.addEventListener('storage', e => {
  if (e.key !== KEY) return;
  if (e.newValue) applyRemoteSave(e.newValue);
  else if (saveTimer === null){
    db = defaultDB(); genKey = ''; fmtCache = {}; render();
    updateSaveState('saved', 'Data cleared in another tab');
    if (!db.profile.onboarded) onboarding();
  }
});

/* ---------- lookups ---------- */
const taskById = id => db.tasks.find(t => t.id === id);
const catById = id => db.cats.find(c => c.id === id);
const goalById = id => db.goals.find(g => g.id === id);
const occById = id => db.occs.find(o => o.id === id);
const cats = (kind, withArchived) => db.cats.filter(c => c.kind === kind && (withArchived || !c.archived)).sort((a, b) => a.order - b.order);
const audioById = id => db.audio.find(a => a.id === id);

let fmtCache = {};
function fmt(n, opts){
  const cur = db.profile.currency;
  const frac = Number.isInteger(Math.round(n * 100) / 100) && Number.isInteger(n) ? 0 : 2;
  const k = cur + frac;
  if (!fmtCache[k]){
    try { fmtCache[k] = new Intl.NumberFormat(cur === 'INR' ? 'en-IN' : undefined, {style: 'currency', currency: cur, minimumFractionDigits: frac, maximumFractionDigits: frac}); }
    catch (e) { fmtCache[k] = {format: v => cur + ' ' + v.toFixed(frac)}; }
  }
  return fmtCache[k].format(n);
}
const pctTxt = n => n == null ? '–' : (Math.round(n * 10) / 10) + '%';

/* ---------- recurrence and occurrences ---------- */
function occursOn(t, d){
  const r = t.rec;
  if (d < t.date) return false;
  if (r.end && d > r.end) return false;
  switch (r.type){
    case 'none': return d === t.date;
    case 'daily': return true;
    case 'weekdays': return (r.days || []).includes(dowOf(d));
    case 'weekly': return dowOf(d) === dowOf(t.date);
    case 'monthly': { const [y, m, dd] = d.split('-').map(Number); const sd = Number(t.date.slice(8)); return dd === Math.min(sd, new Date(y, m, 0).getDate()); }
    case 'interval': return diffDays(t.date, d) % Math.max(1, r.n || 1) === 0;
  }
  return false;
}
function ruleText(t){
  const r = t.rec;
  switch (r.type){
    case 'none': return 'One time';
    case 'daily': return 'Every day';
    case 'weekdays': return 'Every ' + ((r.days || []).slice().sort().map(d => WD[d]).join(', ') || 'selected day');
    case 'weekly': return 'Weekly on ' + WD[dowOf(t.date)];
    case 'monthly': return 'Monthly on day ' + Number(t.date.slice(8));
    case 'interval': return 'Every ' + r.n + ' days';
  }
  return '';
}
let genKey = '';
function ensureOccs(force){
  const td = todayStr();
  if (!force && genKey === td + '|' + db.tasks.length + '|' + db.occs.length) return;
  const horizon = addDays(td, 45);
  const have = new Set(db.occs.map(o => o.taskId + '|' + (o.orig || o.date)));
  const floor = addDays(td, -400);
  let added = 0;
  for (const t of db.tasks){
    if (t.state !== 'active') continue;
    let from = t.date;
    if (t.ruleFrom && t.ruleFrom > from) from = t.ruleFrom;
    if (from < floor) from = floor;
    let end = horizon;
    if (t.rec.end && t.rec.end < end) end = t.rec.end;
    if (t.rec.type === 'none'){ end = t.date; from = t.date; }
    for (let d = from, n = 0; d <= end && n < 500; d = addDays(d, 1), n++){
      if (!occursOn(t, d)) continue;
      const k = t.id + '|' + d;
      if (have.has(k)) continue;
      have.add(k);
      db.occs.push({id: uid(), taskId: t.id, date: d, start: t.startTime || '', due: t.dueTime || '', status: 'pending'});
      added++;
    }
  }
  genKey = td + '|' + db.tasks.length + '|' + db.occs.length;
  if (added) save();
}
function occDue(o){ return dtOf(o.date, o.due || o.start || '23:59'); }
function dstatus(o, now){
  if (o.status !== 'pending') return o.status;
  return occDue(o) < (now || new Date()) ? 'missed' : 'pending';
}
function statusesOfTask(taskId, upTo){
  const now = new Date();
  return db.occs.filter(o => o.taskId === taskId && o.date <= (upTo || todayStr())).sort((a, b) => a.date.localeCompare(b.date)).map(o => dstatus(o, now));
}
function logAct(occId, action, prev, next, note){
  db.log.push({id: uid(), occId, action, ts: new Date().toISOString(), prev: prev || '', next: next || '', note: note || ''});
  if (db.log.length > 4000) db.log.splice(0, db.log.length - 4000);
}

/* ---------- sounds ---------- */
let ac = null, soundUnlocked = false;
function audioCtx(){
  if (!ac){ const C = window.AudioContext || window.webkitAudioContext; if (C) { try { ac = new C(); } catch (e) { ac = null; } } }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  return ac;
}
function playTone(name){
  const c = audioCtx(); const tone = TONES[name] || TONES.chime;
  if (!c) return;
  const vol = Math.max(0.02, db.profile.volume) * .5;
  const t0 = c.currentTime + .02;
  for (const [f, s, d] of tone.n){
    const o = c.createOscillator(), g = c.createGain();
    o.type = name === 'bell' ? 'triangle' : 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t0 + s); g.gain.linearRampToValueAtTime(vol, t0 + s + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + s + d + .25);
    o.connect(g); g.connect(c.destination); o.start(t0 + s); o.stop(t0 + s + d + .3);
  }
}
function playSound(spec){
  if (!spec || spec === 'none' || spec === 'silent') return;
  if (spec.startsWith('tone:')) return playTone(spec.slice(5));
  if (spec.startsWith('audio:')){
    const a = audioById(spec.slice(6));
    if (!a){ toast('That sound file is missing, so the chime played instead.', '🔇'); return playTone('chime'); }
    try { const el = new Audio(a.url); el.volume = Math.min(1, db.profile.volume); el.play().catch(() => { toast('The sound could not play. Tap anywhere on the page first, then try again.', '🔇'); }); }
    catch (e) { playTone('chime'); }
  }
}
function soundLabel(spec){
  if (!spec) return 'Chime';
  if (spec === 'none') return 'Popup only';
  if (spec === 'silent') return 'Silent notification';
  if (spec.startsWith('tone:')) return (TONES[spec.slice(5)] || TONES.chime).label;
  const a = audioById(spec.slice(6)); return a ? a.name : 'Missing sound';
}
function soundOptions(sel){
  const o = x => `<option value="${esc(x[0])}"${x[0] === sel ? ' selected' : ''}>${esc(x[1])}</option>`;
  let h = '<optgroup label="Built-in tones">' + Object.keys(TONES).map(k => o(['tone:' + k, TONES[k].e + ' ' + TONES[k].label])).join('') + '</optgroup>';
  if (db.audio.length) h += '<optgroup label="My sounds">' + db.audio.map(a => o(['audio:' + a.id, (a.kind === 'voice' ? '🎙️ ' : '🎵 ') + a.name])).join('') + '</optgroup>';
  h += '<optgroup label="No sound">' + o(['none', '👁️ Popup only']) + o(['silent', '🔕 Silent notification']) + '</optgroup>';
  return h;
}

/* ---------- reminders ---------- */
function inQuiet(now){
  const p = db.profile; if (!p.quietOn) return false;
  const cur = pad(now.getHours()) + ':' + pad(now.getMinutes());
  return p.quietStart <= p.quietEnd ? (cur >= p.quietStart && cur < p.quietEnd) : (cur >= p.quietStart || cur < p.quietEnd);
}
function nextReminder(){
  const now = Date.now(); let best = null;
  for (const o of db.occs){
    if (o.status !== 'pending') continue;
    const t = taskById(o.taskId); if (!t || t.state !== 'active' || !t.rem || !t.rem.on) continue;
    const at = dtOf(o.date, o.start || o.due || '09:00').getTime() - (t.rem.lead || 0) * 60000;
    if (at < now - 60000) continue;
    if (!best || at < best.at) best = {at, o, t};
  }
  return best;
}
function checkReminders(){
  const now = new Date(), nowT = now.getTime();
  let changed = false;
  for (const o of db.occs){
    if (o.status !== 'pending') continue;
    const t = taskById(o.taskId);
    if (!t || t.state !== 'active' || !t.rem || !t.rem.on) continue;
    if (o.date > addDays(todayStr(), 1) || o.date < addDays(todayStr(), -1)) continue;
    const base = dtOf(o.date, o.start || o.due || '09:00').getTime();
    const trig = base - (t.rem.lead || 0) * 60000;
    const maxFires = 1 + (t.rem.repeat || 0);
    let fireAt;
    if (o.snoozeUntil) fireAt = new Date(o.snoozeUntil).getTime();
    else if (o.fires) { if (o.fires >= maxFires) continue; fireAt = new Date(o.lastFire).getTime() + db.profile.snooze * 60000; }

  const todays = db.occs.filter(o => o.date === td && o.status !== 'cancelled').sort((a, b) => (a.start || a.due || '99').localeCompare(b.start || b.due || '99'));
  const doneN = todays.filter(o => o.status === 'done').length;
  const hT = todays.filter(o => { const t = taskById(o.taskId); return t && t.rec.type !== 'none'; }), hD = hT.filter(o => o.status === 'done').length;

  const days7 = Array.from({length: 7}, (_, i) => addDays(td, i - 6));
  const stat = (c, ic, k, v) => `<div class="stat" style="--c:${c}">${ibadge(ic, c)}<div style="min-width:0"><div class="sk">${k}</div><div class="sv mono">${v}</div></div></div>`;
  const qt = (a, ic, c, l) => `<button class="qtile" type="button" data-a="${a}">${ibadge(ic, c)}<span>${l}</span></button>`;
  const cats = Object.entries(md.cats).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const topSpend = cats.length ? cats[0][1] : 0;
  const goal = db.goals.slice().sort((a, b) => Calc.pct(b.actual, b.target) - Calc.pct(a.actual, a.target)).find(g => g.actual < g.target) || db.goals[0];
  const wk = Array.from({length: 7}, (_, i) => rateRange(addDays(td, i - 6), addDays(td, i - 6)) || 0);
  const mp = Math.round(md.rate || 0), C = 2 * Math.PI * 40;
  return `<div class="page">
    ${p.sample ? `<div class="banner"><span aria-hidden="true">🧪</span><span class="grow">You are looking at <b>sample data</b> so you can explore. Clear it any time and start fresh.</span><button class="btn small" type="button" data-a="clearSamples">Clear sample data</button></div>` : ''}
    ${memOnly ? `<div class="banner"><span aria-hidden="true">⚠️</span><span class="grow">This view cannot keep data after you close it. Export a backup from Settings, or open the saved app file in your browser.</span></div>` : ''}
    <div class="thead">${ibadge(TICON[th.id].i, TICON[th.id].c, 52)}<div><h2 class="tt">${esc(th.name)} Theme</h2><p class="ts">${esc(th.tag)}</p></div><span class="grow" style="flex:1"></span><button type="button" class="tuser" data-a="goView" data-v="journey" aria-label="Open my journey">${avatarHtml(36, r30 || 0)}<span>${esc(p.name || 'You')}<small>Level ${xpInfo().lvl} · ${xpInfo().title}</small></span></button></div>
    <section class="card hero" aria-label="Today">
      <div class="hero-l">${avatarHtml(104, r30 || 0)}<div class="stack" style="min-width:0;gap:6px">
        <h1 class="hello">${g.e} ${esc(g.g)}${p.name ? ', ' + esc(p.name) : ''}</h1>
        <p class="sub">${esc(dayLabel(td))} · ${th.emoji} ${esc(th.tag)}</p>
        <p class="quote">“${esc(th.quote)}”</p>
        <p><span class="chip">⏰ ${nr ? 'Next: <b>' + esc((taskById(nr.o.taskId) || {}).title || '') + '</b> ' + relTime(nr.at - now.getTime()) : 'No reminders coming up'}</span></p>
      </div></div>
      ${themeWidget()}
    </section>
    <div class="stats">
      ${stat('#f5a623', 'check', 'Tasks', doneN + '/' + todays.length)}
      ${stat('#2fb344', 'leaf', 'Habits', hD + '/' + hT.length)}
      ${stat('#2f80ed', 'wallet', 'Balance', fmt(md.tot.remainder))}
      ${stat('#a855f7', 'flame', 'Streak', streakDays() + (streakDays() === 1 ? ' day' : ' days'))}
    </div>
    <div class="split">
      <section class="card" aria-label="${esc(th.today)}">
        <h2>${ibadge('tasks', 'var(--accent)', 30)} ${esc(th.today)} <span class="grow"></span><button class="btn small" type="button" data-a="goView" data-v="calendar">Calendar</button></h2>
        ${todays.length ? todays.map(missionRow).join('') : emptyState('🌤️', 'Nothing planned today.', '<button class="btn primary" type="button" data-a="newTask">Add your first task</button>')}
      </section>
      <div class="stack" style="gap:18px">
        <section class="card" aria-label="This month"><h2>${ibadge('calendar', '#2f80ed', 30)} ${esc(monthLabel(cm))}</h2>${miniCal()}</section>
        <section class="card" aria-label="Quick actions"><h2>${esc(th.id === 'car' ? 'Quick Fuel' : th.id === 'space' ? 'Galaxy Actions' : 'Quick Actions')}</h2><div class="qbtns">
          <button class="qbtn" type="button" data-a="newTask">${icon('plus')} Add Task</button><button class="qbtn" type="button" data-a="newExpense">${icon('plus')} Add Expense</button><button class="qbtn" type="button" data-a="newGoal">${icon('plus')} Set Goal</button></div>
          <div class="qgrid" style="margin-top:12px">${qt('newReminder', 'bell', '#f5a623', 'Reminder')}${qt('newIncome', 'income', '#2f80ed', 'Income')}${qt('newCheckin', 'cam', '#0ea5a4', 'Check-in')}</div></section>
      </div>

      ${habits.length ? habits.map(t => habitRow(t, days7)).join('') : emptyState('🌱', 'Repeating tasks become habits with streaks.', '<button class="btn small" type="button" data-a="newTask">Create a habit</button>')}
    </section>

  </div>`;

function habitRow(t, days){
  const sts = statusesOfTask(t.id);
  const dots = days.map(d => { const o = db.occs.find(o => o.taskId === t.id && o.date === d); const s = o ? dstatus(o) : null; return s ? `<span class="d-${s}" title="${esc(dayLabel(d))}: ${ST[s].l}"><span class="sr">${ST[s].l}</span><span aria-hidden="true">${ST[s].i}</span></span>` : `<span title="${esc(dayLabel(d))}: not scheduled"><span aria-hidden="true">·</span></span>`; }).join('');
  return `<div class="habit"><span aria-hidden="true" style="font-size:1.3rem">${esc(t.emoji)}</span><div style="flex:1;min-width:0"><b class="otitle">${esc(t.title)}</b><div class="dots" aria-label="Recent days">${dots}</div></div><span class="streak" title="Consecutive completed occurrences">🔥 ${Calc.streak(sts)}</span></div>`;
}

function filteredOccsOn(d){
  const now = new Date();
  return db.occs.filter(o => {
    if (o.date !== d) return false;
    const t = taskById(o.taskId); if (!t) return false;
    if (ui.fCat && t.catId !== ui.fCat) return false;
    if (ui.fPrio && t.prio !== ui.fPrio) return false;
    if (ui.fStatus){ const s = dstatus(o, now); if (ui.fStatus === 'moved' ? !o.moved : s !== ui.fStatus) return false; }
    return true;
  }).sort((a, b) => (a.start || a.due || '99').localeCompare(b.start || b.due || '99'));
}
function viewCalendar(){
  const td = todayStr(), now = new Date();
  let cells = [], title;
  if (ui.calMode === 'month'){
    const first = ui.calMonth + '-01', lead = dowOf(first), total = Math.ceil((lead + daysInMonth(ui.calMonth)) / 7) * 7;
    for (let i = 0; i < total; i++) cells.push(addDays(first, i - lead));
    title = monthLabel(ui.calMonth);
  } else {
    const s = addDays(ui.calSel, -dowOf(ui.calSel));
    for (let i = 0; i < 7; i++) cells.push(addDays(s, i));
    title = dayLabel(cells[0]) + ' – ' + dayLabel(cells[6]);
  }
  const grid = cells.map(d => {
    const list = filteredOccsOn(d), out = ui.calMode === 'month' && monthOf(d) !== ui.calMonth;
    const mk = list.slice(0, ui.calMode === 'week' ? 0 : 5).map(o => { const s = dstatus(o, now); return `<span class="m-${s}" aria-hidden="true">${o.moved ? '↻' : ST[s].i}</span>`; }).join('');
    const items = ui.calMode === 'week' ? list.slice(0, 6).map(o => `<span class="wk-item">${esc((taskById(o.taskId) || {}).emoji || '')} ${esc((taskById(o.taskId) || {}).title || '')}</span>`).join('') : '';
    return `<button type="button" class="cell${out ? ' out' : ''}${d === td ? ' today' : ''}${d === ui.calSel ? ' sel' : ''}" data-a="pickDay" data-d="${d}" data-drop="${d}" aria-label="${esc(dayLabel(d))}, ${list.length} task${list.length === 1 ? '' : 's'}"${d === ui.calSel ? ' aria-current="date"' : ''}>
      <span class="dn">${Number(d.slice(8))}</span><span class="mk">${mk}${list.length > 5 && ui.calMode === 'month' ? '<span class="muted">+' + (list.length - 5) + '</span>' : ''}</span>${items}</button>`;
  }).join('');
  const dayList = filteredOccsOn(ui.calSel);
  return `<div class="page">
    <div class="page-head"><div><h1>🗓️ Calendar</h1><p class="sub">Tap a day to see it. On a large screen, drag a task onto another day to reschedule.</p></div>
      <button class="btn primary" type="button" data-a="newTask" data-d="${ui.calSel}">＋ Task on ${esc(dayLabel(ui.calSel))}</button></div>
    <div class="card">
      <div class="rowf" style="justify-content:space-between;margin-bottom:12px">
        <div class="rowf"><button class="iconbtn" type="button" data-a="calPrev" aria-label="Previous">‹</button><h2 style="min-width:9ch;font-size:1.2rem">${esc(title)}</h2><button class="iconbtn" type="button" data-a="calNext" aria-label="Next">›</button><button class="btn small" type="button" data-a="calToday">Today</button></div>
        <div class="seg" role="group" aria-label="View"><button type="button" data-a="calMode" data-m="month" aria-pressed="${ui.calMode === 'month'}">Month</button><button type="button" data-a="calMode" data-m="week" aria-pressed="${ui.calMode === 'week'}">Week</button></div>
      </div>
      <div class="fgrid" style="margin-bottom:12px">
        <div class="field"><label for="f-cat">Category</label><select id="f-cat" data-change="fCat"><option value="">All</option>${cats('task').map(c => `<option value="${c.id}"${ui.fCat === c.id ? ' selected' : ''}>${esc(c.emoji + ' ' + c.name)}</option>`).join('')}</select></div>
        <div class="field"><label for="f-status">Status</label><select id="f-status" data-change="fStatus"><option value="">All</option>${['pending', 'done', 'partial', 'missed', 'skipped', 'cancelled'].map(s => `<option value="${s}"${ui.fStatus === s ? ' selected' : ''}>${ST[s].i} ${ST[s].l}</option>`).join('')}<option value="moved"${ui.fStatus === 'moved' ? ' selected' : ''}>↻ Rescheduled</option></select></div>
        <div class="field"><label for="f-prio">Priority</label><select id="f-prio" data-change="fPrio"><option value="">All</option><option value="high"${ui.fPrio === 'high' ? ' selected' : ''}>High</option><option value="med"${ui.fPrio === 'med' ? ' selected' : ''}>Normal</option><option value="low"${ui.fPrio === 'low' ? ' selected' : ''}>Low</option></select></div>
      </div>
      <div class="cal" role="group" aria-label="Calendar grid">${WD.map(w => `<div class="wd">${w}</div>`).join('')}${grid}</div>
      <div class="legend" style="margin-top:12px"><span>✓ Done</span><span>● Pending</span><span>✕ Missed</span><span>◐ Partial</span><span>⏭ Skipped</span><span>↻ Rescheduled</span></div>
    </div>
    <section class="card" aria-label="Selected day">
      <h2>📌 ${esc(dayLabel(ui.calSel))}</h2>
      ${dayList.length ? dayList.map(o => occRow(o, true)).join('') : emptyState('🗓️', 'Nothing here for this day.', `<button class="btn small" type="button" data-a="newTask" data-d="${ui.calSel}">Add a task</button>`)}
    </section>
  </div>`;
}

function taskRow(t){
  const sts = statusesOfTask(t.id), nextO = db.occs.filter(o => o.taskId === t.id && o.status === 'pending' && o.date >= todayStr()).sort((a, b) => a.date.localeCompare(b.date))[0];
  const target = Number(t.targetAmount) || 0;
  return `<div class="tx"><span class="ce" style="--c:${esc((catById(t.catId) || {color: '#8a8fa6'}).color)}" aria-hidden="true">${esc(t.emoji)}</span>
    <div style="flex:1;min-width:0"><b class="otitle">${esc(t.title)}</b>${t.state === 'paused' ? ' <span class="st">⏸ Paused</span>' : ''}
      <div class="ometa">${esc(ruleText(t))}${t.startTime ? ' · ' + esc(t.startTime) : ''} · ${prioTxt(t.prio)}${target ? ' · target ' + target + ' ' + esc(t.targetUnit || '') + ' per date' : ''}${t.rec.type !== 'none' ? ' · 🔥 ' + Calc.streak(sts) : ''}${nextO ? ' · next ' + esc(dayLabel(nextO.date)) : ''}</div></div>
    <button class="iconbtn sm" type="button" data-a="editTask" data-id="${t.id}" aria-label="Edit ${esc(t.title)}">✏️</button>
    ${t.rec.type !== 'none' ? `<button class="iconbtn sm" type="button" data-a="pauseTask" data-id="${t.id}" aria-label="${t.state === 'paused' ? 'Resume' : 'Pause'} ${esc(t.title)}">${t.state === 'paused' ? '▶️' : '⏸️'}</button>` : ''}
  </div>`;
}
function viewTasks(){
  const td = todayStr(), now = new Date();
  const up = Array.from({length: 7}, (_, i) => addDays(td, i)).map(d => ({d, list: db.occs.filter(o => o.date === d && o.status !== 'cancelled').sort((a, b) => (a.start || a.due || '99').localeCompare(b.start || b.due || '99'))})).filter(x => x.list.length);
  const act = db.tasks.filter(t => t.state !== 'archived'), arch = db.tasks.filter(t => t.state === 'archived');
  return `<div class="page">
    <div class="page-head"><div><h1>✅ Tasks</h1><p class="sub">Everything coming up this week, plus every task you have set.</p></div><button class="btn primary" type="button" data-a="newTask">＋ New task</button></div>
    <section class="card"><h2>📆 Coming up</h2>${up.length ? up.map(x => `<div class="lbl-t" style="margin:10px 0 2px">${x.d === td ? 'Today' : esc(dayLabel(x.d))}</div>${x.list.map(o => occRow(o)).join('')}`).join('') : emptyState('🌤️', 'Nothing planned for the next 7 days.', '<button class="btn primary" type="button" data-a="newTask">Add a task</button>')}</section>
    <section class="card"><h2>🗒️ All tasks</h2>${act.length ? act.map(taskRow).join('') : emptyState('📝', 'No tasks yet.', '')}</section>
    ${arch.length ? `<section class="card flat"><h2>🗄️ Archived <span class="grow"></span><button class="btn small" type="button" data-a="toggleArchived">${ui.showArchived ? 'Hide' : 'Show ' + arch.length}</button></h2>${ui.showArchived ? arch.map(t => `<div class="tx"><span aria-hidden="true">${esc(t.emoji)}</span><b style="flex:1" class="otitle">${esc(t.title)}</b><button class="btn small" type="button" data-a="restoreTask" data-id="${t.id}">Restore</button></div>`).join('') : '<p class="sub">History of archived tasks stays in your reports.</p>'}</section>` : ''}
    <section class="card flat"><h2>🏷️ Task categories</h2>${catManager('task')}</section>
  </div>`;
}
function viewHabits(){
  const td = todayStr(), days = Array.from({length: 14}, (_, i) => addDays(td, i - 13)), now = new Date();
  const rec = db.tasks.filter(t => t.state !== 'archived' && t.rec.type !== 'none');
  const card = t => {
    const sts = statusesOfTask(t.id), from = addDays(td, -29);
    const r30 = Calc.completionRate(Calc.tally(db.occs.filter(o => o.taskId === t.id && o.date >= from && o.date <= td).map(o => dstatus(o, now))), {partialCredit: db.profile.partialCredit, skippedCounts: db.profile.skippedCounts});
    const dots = days.map(d => { const o = db.occs.find(o => o.taskId === t.id && o.date === d); const s = o ? dstatus(o) : null; return s ? `<span class="d-${s}" title="${esc(dayLabel(d))}: ${ST[s].l}"><span class="sr">${ST[s].l}</span><span aria-hidden="true">${ST[s].i}</span></span>` : `<span title="${esc(dayLabel(d))}: not scheduled"><span aria-hidden="true">·</span></span>`; }).join('');
    return `<div class="tile"><div class="rowf" style="justify-content:space-between;flex-wrap:nowrap"><b class="otitle" style="min-width:0">${esc(t.emoji)} ${esc(t.title)}</b><button class="iconbtn sm" type="button" data-a="editTask" data-id="${t.id}" aria-label="Edit ${esc(t.title)}">✏️</button></div>
      <div class="ometa" style="margin:2px 0 8px">${esc(ruleText(t))}${t.state === 'paused' ? ' · ⏸ Paused' : ''}</div><div class="dots" aria-label="Last 14 days">${dots}</div>
      <div class="rowf" style="margin-top:10px;justify-content:space-between"><span class="streak">🔥 ${Calc.streak(sts)} now</span><span class="streak muted">🏅 ${Calc.bestStreak(sts)} best</span><span class="streak muted">${pctTxt(r30)} · 30d</span></div></div>`;
  };
  return `<div class="page">
    <div class="page-head"><div><h1>🔥 Habits &amp; goals</h1><p class="sub">Streak = consecutive completed days on your schedule. Skipped days do not break it.</p></div><button class="btn primary" type="button" data-a="newTask">＋ New habit</button></div>
    <section><div class="grid g2">${rec.length ? rec.map(card).join('') : `<div class="card" style="grid-column:1/-1">${emptyState('🌱', 'Make a task repeat to turn it into a habit.', '<button class="btn primary" type="button" data-a="newTask">Create a habit</button>')}</div>`}</div></section>
    <section class="card"><h2>🎯 Goals <span class="grow"></span><button class="btn small" type="button" data-a="newGoal">＋ Goal</button></h2>
      ${db.goals.length ? `<div class="grid g2">${db.goals.map(g => { const p = Calc.pct(g.actual, g.target); return `<div class="tile"><div class="rowf" style="justify-content:space-between"><b>${esc(g.emoji || '🎯')} ${esc(g.title)}</b><button class="iconbtn sm" type="button" data-a="editGoal" data-id="${g.id}" aria-label="Edit goal ${esc(g.title)}">✏️</button></div>
        <div class="meter" style="margin:10px 0 6px" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(100, Math.round(p))}"><i style="width:${Math.min(100, p)}%"></i></div>
        <div class="rowf" style="justify-content:space-between"><span class="mono muted">${g.actual} / ${g.target} ${esc(g.unit || '')} · ${pctTxt(p)}</span><button class="btn small" type="button" data-a="goalPlus" data-id="${g.id}">＋1 ${p >= 100 ? '🏆' : '💪'}</button></div></div>`; }).join('')}</div>` : emptyState('🎯', 'Goals give your habits a bigger reason.', '<button class="btn small" type="button" data-a="newGoal">Add a goal</button>')}
    </section>
  </div>`;
}
function monthNav(key){
  return `<div class="rowf"><button class="iconbtn" type="button" data-a="monthPrev" data-k="${key}" aria-label="Previous month">‹</button><b style="min-width:11ch;text-align:center;font-family:var(--font-display);font-size:1.1rem">${esc(monthLabel(ui[key]))}</b><button class="iconbtn" type="button" data-a="monthNext" data-k="${key}" aria-label="Next month">›</button></div>`;
}
function catBars(md, big){
  const entries = Object.entries(md.cats).filter(e => e[1] !== 0).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return emptyState('🧾', 'No spending recorded for this month yet.', '<button class="btn small" type="button" data-a="newExpense">Record an expense</button>');
  const max = Math.max(...entries.map(e => Math.abs(e[1])));
  return entries.map(([id, v]) => { const c = catById(id) || {name: 'Unknown', emoji: '❔', color: '#8a8fa6'}; const bl = budgetOf(id), b = Calc.budget(v, bl);
    return `<div class="catrow"><span class="ce" style="--c:${esc(c.color)}" aria-hidden="true">${esc(c.emoji)}</span><div style="flex:1;min-width:0"><div class="rowf" style="justify-content:space-between"><b>${esc(c.name)}${c.archived ? ' <span class="muted">(archived)</span>' : ''}</b><span class="mono">${fmt(v)}</span></div>
      <div class="meter" style="height:8px;margin-top:6px"><i style="width:${Math.max(2, Math.abs(v) / max * 100)}%;background:${esc(c.color)}"></i></div>
      <div class="ometa">${pctTxt(Calc.pct(v, md.tot.spent))} of expenses${md.tot.income > 0 ? ' · ' + pctTxt(Calc.pct(v, md.tot.income)) + ' of income' : ''}${b ? ' · ' + (b.over > 0 ? '🚨 ' + fmt(b.over) + ' over budget' : pctTxt(b.used) + ' of budget') : ''}</div></div></div>`; }).join('');
}
function viewMoney(){
  const m = ui.moneyMonth, md = monthData(m), tab = ui.moneyTab;
  const tabs = [['overview', '📈 Overview'], ['transactions', '🧾 Transactions'], ['categories', '🏷️ Categories'], ['budgets', '🎯 Budgets']];
  let body = '';
  if (tab === 'overview'){
    const tb = budgetOf(null), tbu = Calc.budget(md.tot.spent, tb);
    body = `<div class="grid g3">
      <div class="tile"><div class="k">💵 Income</div><div class="v mono">${fmt(md.tot.income)}</div><div class="n">${md.tot.expected ? fmt(md.tot.expected) + ' still expected' : 'actual, received'}</div></div>
      <div class="tile"><div class="k">💸 Expenses</div><div class="v mono">${fmt(md.tot.spent)}</div><div class="n">after refunds</div></div>
      <div class="tile"><div class="k">🧮 Remainder</div><div class="v mono ${md.tot.remainder < 0 ? 'neg' : 'pos'}">${fmt(md.tot.remainder)}</div><div class="n">${md.tot.saved ? 'after ' + fmt(md.tot.saved) + ' saved' : 'income − expenses'}</div></div></div>
      ${tbu ? `<section class="card"><h2>🎯 Monthly budget</h2>${meter(tbu.used, tbu.over > 0 ? fmt(tbu.over) + ' over' : fmt(tbu.remaining) + ' left')}</section>` : ''}
      <section class="card"><h2>🍩 Where it went</h2>${catBars(md)}</section>`;
