function donut(md){
  const entries = Object.entries(md.cats).filter(e => e[1] > 0), total = entries.reduce((s, e) => s + e[1], 0);
  if (!total) return '';
  let off = 0;
  const arcs = entries.sort((a, b) => b[1] - a[1]).map(([id, v]) => { const p = v / total * 100, c = catById(id) || {color: '#8a8fa6'}; const s = `<circle cx="21" cy="21" r="15.9155" stroke="${esc(c.color)}" stroke-dasharray="${p.toFixed(2)} ${(100 - p).toFixed(2)}" stroke-dashoffset="${(25 - off).toFixed(2)}"/>`; off += p; return s; }).join('');
  return `<svg class="donut" viewBox="0 0 42 42" role="img" aria-label="Spending by category"><circle class="trk" cx="21" cy="21" r="15.9155"/>${arcs}<text x="21" y="22.5">${entries.length}</text><text class="s" x="21" y="27">categories</text></svg>`;
}
function dailyBars(md){
  const n = daysInMonth(md.m), vals = Array(n).fill(0);
  for (const e of md.exp){ if (e.kind === 'saving') continue; vals[Number(e.date.slice(8)) - 1] += e.kind === 'refund' ? -e.amount : e.amount; }
  const max = Math.max(1, ...vals), W = 320, H = 120, bw = (W - 20) / n;
  const bars = vals.map((v, i) => { const h = Math.max(0, v) / max * 84; return v > 0 ? `<rect class="bar" x="${(10 + i * bw + 1).toFixed(1)}" y="${(96 - h).toFixed(1)}" width="${Math.max(2, bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="2"/>` : ''; }).join('');
  const lbl = [1, Math.ceil(n / 2), n].map(d => `<text class="t" x="${(10 + (d - 1) * bw + bw / 2).toFixed(1)}" y="112" text-anchor="middle">${d}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily spending, highest day ${esc(fmt(max))}"><line class="axis" x1="10" x2="${W - 10}" y1="96" y2="96"/>${bars}${lbl}<text class="tv" x="10" y="10">Peak day ${esc(fmt(max))}</text></svg>`;
}
function trendBars(){
  const ms = Array.from({length: 6}, (_, i) => addMonths(ui.repMonth, i - 5)), W = 320, H = 130, bw = 34, gap = (W - 20 - bw * 6) / 5;
  const bars = ms.map((m, i) => { const r = monthData(m).rate, x = 10 + i * (bw + gap), h = (r || 0) / 100 * 80;
    return `<rect class="bar" x="${x.toFixed(1)}" y="${(100 - h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="4" opacity="${m === ui.repMonth ? 1 : .55}"/><text class="tv" x="${(x + bw / 2).toFixed(1)}" y="${(94 - h).toFixed(1)}" text-anchor="middle">${r == null ? '–' : Math.round(r) + '%'}</text><text class="t" x="${(x + bw / 2).toFixed(1)}" y="118" text-anchor="middle">${esc(monthShort(m))}</text>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Task completion rate, last six months"><line class="axis" x1="10" x2="${W - 10}" y1="100" y2="100"/>${bars}</svg>`;
}
function suggestions(md, pmd){
  const s = [];
  for (const [id, v] of Object.entries(md.cats)){ const b = Calc.budget(v, budgetOf(id)), c = catById(id); if (!b || !c) continue;
    if (b.over > 0) s.push(['🚨', `${c.name} went over its budget by ${fmt(b.over)}. You could raise the limit or look at the biggest purchases.`]);
    else if (b.used >= 80) s.push(['⚠️', `${c.name} has used ${pctTxt(b.used)} of its budget with ${fmt(b.remaining)} left.`]); }
  const tbu = Calc.budget(md.tot.spent, budgetOf(null));
  if (tbu && tbu.over > 0) s.push(['🚨', `Total spending is ${fmt(tbu.over)} over the monthly budget.`]);
  const unc = md.exp.filter(e => e.catId === 'uncat').length; if (unc) s.push(['🗂️', `${unc} expense${unc > 1 ? 's are' : ' is'} uncategorized. Sorting them makes this report more accurate.`]);
  if (!md.tot.income && md.exp.length) s.push(['💵', 'No income is recorded for this month, so percentages of income are not available.']);
  if (md.t.missed) s.push(['⏰', `${md.t.missed} task${md.t.missed > 1 ? 's were' : ' was'} missed. Earlier reminders or a lighter plan might help.`]);
  const d = Calc.points(md.rate, pmd.rate); if (d != null && d > 0) s.push(['📈', `Completion is up ${Math.round(d * 10) / 10} points from last month. Keep it going!`]);

  if (md.tot.remainder > 0 && md.tot.income > 0 && !md.tot.saved) s.push(['🐷', `You have ${fmt(md.tot.remainder)} left over. You could move some of it to savings.`]);

}

/* ---------- voice recording ---------- */
let rec = null;
async function recStart(){
  const st = $('#recStatus'), btn = $('#recBtn');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    const mr = new MediaRecorder(stream), chunks = [];
    rec = {mr, stream, chunks, t0: Date.now(), cancelled: false};
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const r = rec; rec = null;
      if (!r || r.cancelled) return;
      const blob = new Blob(chunks, {type: mr.mimeType || 'audio/webm'});
      if (blob.size > 1.4e6){ toast('That recording is too long. Keep it under about 15 seconds.', '⚠️'); render(); return; }
      const fr = new FileReader();
      fr.onload = () => { db.audio.push({id: uid(), name: 'Voice note ' + (db.audio.filter(a => a.kind === 'voice').length + 1), kind: 'voice', url: fr.result, dur: Math.round((Date.now() - r.t0) / 1000), created: new Date().toISOString()}); commit(); toast('Voice saved. Pick it as a reminder sound.', '🎙️'); };
      fr.readAsDataURL(blob);
    };
    mr.start();
    if (btn) btn.textContent = '⏹️ Stop recording';
    const wv = $('#recWave'); if (wv) wv.classList.add('on');
    if (st) st.textContent = '🔴 Recording… (stops by itself after 15 seconds)';
    rec.timer = setTimeout(() => { if (rec && rec.mr.state === 'recording') rec.mr.stop(); }, 15000);
  } catch (e) {
    rec = null;
    if (st) st.textContent = 'Microphone is not available here. Open the saved app file in your browser and allow the microphone, or import an audio file instead.';
    toast('Could not start the microphone.', '🎙️');
  }
}
function recStop(){ if (rec && rec.mr.state === 'recording'){ clearTimeout(rec.timer); rec.mr.stop(); } const wv = $('#recWave'); if (wv) wv.classList.remove('on'); }
function recCancel(){ if (rec){ rec.cancelled = true; clearTimeout(rec.timer); try { rec.mr.stop(); } catch (e) {} rec = null; } }

  return s;
}

    s += `<path d="M${x.toFixed(0)} ${y0 - hh} L${(x - w).toFixed(0)} ${y0} L${(x + w).toFixed(0)} ${y0}Z" fill="${color}"/>`; }

/* ---------- photo storage (IndexedDB, so photos never fill the settings storage) ---------- */
const IMG = {cache: {}, dbp: null, ok: true};
const imgGet = id => (id && IMG.cache[id]) || '';
function idb(){
  if (IMG.dbp) return IMG.dbp;
  IMG.dbp = new Promise((res, rej) => {
    try {
      const q = indexedDB.open('wtc-img', 1);
      q.onupgradeneeded = () => q.result.createObjectStore('img');
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); q.onblocked = () => rej(new Error('blocked'));
    } catch (e) { rej(e); }
  });
  return IMG.dbp;
}
async function imgInit(){
  try {
    const d = await idb();
    await new Promise((res, rej) => {
      const c = d.transaction('img').objectStore('img').openCursor();
      c.onsuccess = () => { const cur = c.result; if (cur){ IMG.cache[cur.key] = cur.value; cur.continue(); } else res(); };
      c.onerror = () => rej(c.error);
    });
  } catch (e) { IMG.ok = false; }
}
async function imgPut(id, data){
  IMG.cache[id] = data;
  try {
    const d = await idb();
    await new Promise((res, rej) => { const tx = d.transaction('img', 'readwrite'); tx.objectStore('img').put(data, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    return true;
  } catch (e) { IMG.ok = false; toast('Photos cannot be saved in this view, so they will be gone when you close it. The saved app file keeps them.', '⚠️'); return false; }
}
async function imgDel(id){
  if (!id) return; delete IMG.cache[id];
  try { const d = await idb(); await new Promise(res => { const tx = d.transaction('img', 'readwrite'); tx.objectStore('img').delete(id); tx.oncomplete = res; tx.onerror = res; }); } catch (e) {}
}
async function imgClearAll(){
  IMG.cache = {};
  try { const d = await idb(); await new Promise(res => { const tx = d.transaction('img', 'readwrite'); tx.objectStore('img').clear(); tx.oncomplete = res; tx.onerror = res; }); } catch (e) {}
}
function loadImg(file){
  return new Promise((res, rej) => {
    const viaImg = () => {
      const u = URL.createObjectURL(file), im = new Image();
      im.onload = () => { URL.revokeObjectURL(u); res(im); };
      im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('bad image')); };
      im.src = u;
    };
    if (window.createImageBitmap){ try { createImageBitmap(file, {imageOrientation: 'from-image'}).then(res, viaImg); } catch (e) { viaImg(); } } else viaImg();
  });
}
async function processImage(file, o){
  const im = await loadImg(file), w = im.width, h = im.height;
  let sx = 0, sy = 0, sw = w, sh = h, tw, th;
  if (o.square){ const s = Math.min(w, h); sx = (w - s) / 2; sy = (h - s) / 2; sw = sh = s; tw = th = o.square; }
  else { const k = Math.min(1, o.max / Math.max(w, h)); tw = Math.round(w * k); th = Math.round(h * k); }
  const c = document.createElement('canvas'); c.width = tw; c.height = th;
  c.getContext('2d').drawImage(im, sx, sy, sw, sh, 0, 0, tw, th);
  if (im.close) im.close();
  return c.toDataURL('image/jpeg', o.q || .75);
}

/* ---------- consistency numbers used by the themed widgets and the journey ---------- */
function rateOver(days){
  const now = new Date(), td = todayStr(), from = addDays(td, -(days - 1));
  const sts = db.occs.filter(o => o.date >= from && o.date <= td).map(o => dstatus(o, now));

  if (a.order === b.order){ list.forEach((x, k) => x.order = k); const t2 = list[i].order; list[i].order = list[j].order; list[j].order = t2; }

    const fd = new FormData(f), id = f.dataset.id, amount = Math.round(Number(fd.get('amount')) * 100) / 100;
    if (!(amount > 0) || !isFinite(amount)) return toast('Enter an amount greater than zero.', '💵');
    const d = {amount, source: String(fd.get('source') || '').trim() || 'Other', date: fd.get('date'), actual: fd.get('actual') !== '0', note: String(fd.get('note') || '').trim()};
    if (id){ const i = db.income.find(x => x.id === id); Object.assign(i, d); delete i.sample; } else db.income.push(Object.assign({id: uid()}, d));
    closeSheet(); commit(); toast('Income saved.', '💵');
  },
  cat: f => {
    const fd = new FormData(f), id = f.dataset.id, kind = f.dataset.k, name = String(fd.get('name') || '').trim();
    if (!name) return toast('Give the category a name.', '✍️');
    const d = {name, emoji: String(fd.get('emoji') || '').trim() || '🏷️', color: fd.get('color') || PALETTE[0]};
    let c;
    if (id){ c = catById(id); Object.assign(c, d); }
    else { c = Object.assign({id: uid(), kind, archived: false, order: Math.max(-1, ...cats(kind, true).filter(x => x.id !== 'uncat').map(x => x.order)) + 1}, d); db.cats.push(c); }
    if (kind === 'expense') setBudget(c.id, Number(fd.get('budget')) || 0);
    closeSheet(); commit(); toast(id ? 'Category updated everywhere.' : 'Category added. It is ready to use.', '🏷️');
  },
  removeCat: f => {
    const id = f.dataset.id, c = catById(id), target = new FormData(f).get('target'); if (!c) return;
    const undo = snapshotUndo();
    if (c.kind === 'expense') db.expenses.forEach(e => { if (e.catId === id) e.catId = target || 'uncat'; });
    else db.tasks.forEach(t => { if (t.catId === id) t.catId = target || ''; });
    db.budgets = db.budgets.filter(b => b.catId !== id); db.cats = db.cats.filter(x => x.id !== id);
    closeSheet(); commit(); toast('Category removed. Records were moved.', '🏷️', undo);
  },
  budgets: f => {
    const fd = new FormData(f); setBudget(null, Number(fd.get('total')) || 0);
    cats('expense').filter(c => c.id !== 'uncat').forEach(c => setBudget(c.id, Number(fd.get('b_' + c.id)) || 0));
    commit(); toast('Budgets saved.', '🎯');
  },
  checkin: f => {
    if (!ciPending) return toast('Add a photo first.', '📸');
    const fd = new FormData(f), id = uid(), img = 'ci-' + id;
    const entry = {id, date: fd.get('date') || todayStr(), imgId: img, mood: fd.get('mood') || '😊', note: String(fd.get('note') || '').trim(), rate: rateOver(30), streak: streakDays(), ts: new Date().toISOString()};
    imgPut(img, ciPending); ciPending = ''; db.checkins.push(entry);
    closeSheet(); ui.view = 'journey'; commit(); celebrate(null); burst(['📸', '✨', '🎉'], innerWidth / 2, innerHeight / 3, 14);
  },
  profile: f => { const fd = new FormData(f); db.profile.name = String(fd.get('name') || '').trim(); db.profile.currency = fd.get('currency'); fmtCache = {}; commit(); toast('Saved.', '🙂'); },
  onboard: (f, e) => {
    const fd = new FormData(f), mode = (e.submitter && e.submitter.value) || 'empty';
    db.profile.name = String(fd.get('name') || '').trim(); db.profile.currency = fd.get('currency'); db.profile.onboarded = true; fmtCache = {};
    if (mode === 'sample') seedSample();
    closeSheet(); commit(); burst(['🎉', '🌱', '✨', '⭐'], innerWidth / 2, innerHeight / 3, 20);
  },
  import: f => {
    let txt = String(new FormData(f).get('text') || '').trim();
    try {
      const d = JSON.parse(txt);
      if (!d || !Array.isArray(d.tasks) || !Array.isArray(d.expenses) || !d.profile) throw new Error('shape');
      const undo = snapshotUndo(); db = d; migrate(); db.profile.onboarded = true; genKey = ''; fmtCache = {};
      closeSheet(); commit(); toast('Backup restored.', '📥', undo);
    } catch (e) { toast('That does not look like a Way to Consistency backup.', '⚠️'); }
  }
};
A.scope = el => { if (!pendingEdit) return closeSheet(); const t = taskById(pendingEdit.id); const d = pendingEdit.data; pendingEdit = null; if (t) applyEdit(t, d, el.dataset.s); };
window.refreshAndroidPermissions = () => { if (ui.view === 'settings') render(); };
window.handleNativeReminderAction = payload => {
  if (!payload || !payload.id) return;
  const o = occById(payload.id);
  if (!o) return;
  closeSheet();
  if (payload.action === 'done'){
    const t = taskById(o.taskId), target = Number(t && t.targetAmount) || 0;
    if (target > 0 && (Number(o.progress) || 0) < target){
      go('tasks'); occSheet(o.id); toast('Log this date’s progress to reach its target.', '🎯'); return;
    }
    if (o.date > todayStr() && t && t.allowEarly === false){
      go('tasks'); occSheet(o.id); toast('This task is not available to complete early.', '🗓️'); return;
    }
    setOcc(o.id, 'done');
    go('tasks');
    if (o.status === 'done') toast('Marked done from your notification.', '✅');
  } else {
    go('tasks');
    occSheet(o.id);
  }
};

/* ---------- change / input handlers ---------- */
const C = {
  fCat: v => { ui.fCat = v; render(); }, fStatus: v => { ui.fStatus = v; render(); }, fPrio: v => { ui.fPrio = v; render(); },
  highContrast: (v, el) => { db.profile.highContrast = el.checked; commit(); },
  txType: v => { ui.txType = v; render(); }, txCat: v => { ui.txCat = v; render(); },
  confetti: (v, el) => { db.profile.confetti = el.checked; save(); if (el.checked) burst(['🎉', '✨'], innerWidth / 2, innerHeight / 2, 10); },
  defaultSound: v => { db.profile.defaultSound = v; save(); playSound(v); },
  lead: v => { db.profile.lead = Number(v); save(); }, snooze: v => { db.profile.snooze = Number(v); save(); },
  volume: v => { db.profile.volume = Number(v); save(); },
  quietOn: (v, el) => { db.profile.quietOn = el.checked; commit(); }, quietStart: v => { db.profile.quietStart = v; save(); }, quietEnd: v => { db.profile.quietEnd = v; save(); },
  dailySummary: (v, el) => { db.profile.dailySummary = el.checked; db.profile.lastSummary = ''; save(); }, summaryTime: v => { db.profile.summaryTime = v || '08:00'; db.profile.lastSummary = ''; save(); },
  skippedCounts: (v, el) => { db.profile.skippedCounts = el.checked; commit(); },
  recType: v => { const m = $('#recMore'); if (m) m.innerHTML = recMore({type: v, days: [], n: 2, end: ''}); },
  audioFile: (v, el) => {
    const file = el.files && el.files[0]; if (!file) return;
    if (file.size > 1.2e6){ toast('That file is over 1 MB. Try a shorter clip.', '⚠️'); el.value = ''; return; }
    const fr = new FileReader();
    fr.onload = () => { db.audio.push({id: uid(), name: file.name.replace(/\.[^.]+$/, '').slice(0, 30) || 'Audio', kind: 'file', url: fr.result, dur: 0, created: new Date().toISOString()}); commit(); toast('Sound imported.', '🎵'); };
    fr.readAsDataURL(file);
  },
  journeyDay: v => { db.profile.journeyDay = Number(v); db.profile.lastJourney = ''; save(); toast(Number(v) < 0 ? 'Weekly photo nudge is off.' : 'I will nudge you every ' + WD[Number(v)] + '.', '⏰'); },
  journeyTime: v => { db.profile.journeyTime = v || '09:00'; db.profile.lastJourney = ''; save(); },
  ciFile: (v, el) => {
    const file = el.files && el.files[0]; if (!file) return;
    processImage(file, {max: 960, q: .78}).then(data => { ciPending = data; const pv = $('#ciPrev'); if (pv) pv.innerHTML = `<img src="${data}" alt="Preview of your check-in photo">`; }).catch(() => toast('That file could not be read as a picture.', '⚠️'));
  },
  avatarFile: (v, el) => {
    const file = el.files && el.files[0]; if (!file) return;
    processImage(file, {square: 320, q: .82}).then(async data => { const old = db.profile.avatarId, id = 'avatar-' + uid(); await imgPut(id, data); db.profile.avatarId = id; imgDel(old); commit(); toast('Profile photo updated.', '🙂'); }).catch(() => toast('That file could not be read as a picture.', '⚠️'));
  },
  bgFile: (v, el) => {
    const file = el.files && el.files[0]; if (!file) return;
    processImage(file, {max: 1600, q: .72}).then(async data => { const old = db.profile.bg.imgId, id = 'bg-' + uid(); await imgPut(id, data); db.profile.bg = {imgId: id, dim: .45, blur: 0}; imgDel(old); commit(); toast('Your picture is now the background.', '🖼️'); }).catch(() => toast('That file could not be read as a picture.', '⚠️'));
  },
  importFile: (v, el) => { const file = el.files && el.files[0]; if (!file) return; const fr = new FileReader(); fr.onload = () => { const ta = $('#importText'); if (ta) ta.value = fr.result; }; fr.readAsText(file); }
};
function syncInput(i){
  if (i.type !== 'radio' && i.type !== 'checkbox') return;
  const v = i.closest('.chipbtn') || i.nextElementSibling; if (v && v.nodeType === 1) v.setAttribute('aria-pressed', i.checked);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  audioCtx();
  const fn = A[el.dataset.a]; if (fn) fn(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); const fn = F[f.dataset.form]; if (fn) fn(f, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.type === 'radio'){ $$(`input[name="${t.name}"]`, t.form || document).forEach(syncInput); }
  else if (t.type === 'checkbox') syncInput(t);
  const k = t.dataset && t.dataset.change; if (k && C[k]) C[k](t.value, t);
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.input;
  if (k === 'txQ'){ ui.txQ = e.target.value; const l = $('#txList'); if (l) l.innerHTML = txList(); }
  else if (k === 'bgDim'){ db.profile.bg.dim = Number(e.target.value) / 100; applyBackground(); save(); }
  else if (k === 'bgBlur'){ db.profile.bg.blur = Number(e.target.value); applyBackground(); save(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetOpen()) { closeSheet(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('label.btn[for]')){ e.preventDefault(); const i = document.getElementById(e.target.getAttribute('for')); if (i) i.click(); }
  if (e.key === 'Tab' && sheetOpen()){
    const f = $$('#sheetRoot button, #sheetRoot input:not(.sr), #sheetRoot select, #sheetRoot textarea, #sheetRoot [tabindex="0"]').filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});
/* drag a task from the selected day onto another day (wide screens) */
document.addEventListener('dragstart', e => { const r = e.target.closest && e.target.closest('[data-occ]'); if (r && e.dataTransfer){ e.dataTransfer.setData('text/plain', r.dataset.occ); e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', e => { const c = e.target.closest && e.target.closest('[data-drop]'); if (c){ e.preventDefault(); $$('.cell.over').forEach(x => x.classList.remove('over')); c.classList.add('over'); } });
document.addEventListener('dragleave', e => { const c = e.target.closest && e.target.closest('[data-drop]'); if (c) c.classList.remove('over'); });
document.addEventListener('drop', e => {
  const c = e.target.closest && e.target.closest('[data-drop]'); if (!c) return; e.preventDefault(); c.classList.remove('over');
  const id = e.dataTransfer.getData('text/plain'), o = occById(id); const d = c.dataset.drop; if (!o || o.date === d) return;
  const prev = o.date + ' ' + timeLabel(o); o.orig = o.orig || o.date; o.date = d; o.moved = true; o.fires = 0; o.snoozeUntil = null; o.lastFire = '';
  logAct(o.id, 'rescheduled', prev, d + ' ' + timeLabel(o)); ui.calSel = d; commit(); toast('Moved to ' + dayLabel(d) + '.', '🕒');
});

/* ---------- start ---------- */
function tick(){
  try { checkReminders(); } catch (e) {}
}
function init(){
  load();
  try {
    if ('BroadcastChannel' in window){
      syncChannel = new BroadcastChannel('wtc-live-v1');
      syncChannel.onmessage = e => {
        if (!e.data || e.data.key !== KEY) return;
        try { const raw = localStorage.getItem(KEY); if (raw) applyRemoteSave(raw); } catch (err) {}
      };
    }
  } catch (e) { syncChannel = null; }
  if (db.profile.tz !== tzName()){ const old = db.profile.tz; db.profile.tz = tzName(); save(); setTimeout(() => toast('Time zone changed from ' + old + '. Your reminders were rechecked.', '🌍'), 600); }
  ensureOccs(true); render();
  syncNativeReminders();
  imgInit().then(() => render());
  if (!db.profile.onboarded && !db.tasks.length && !db.expenses.length) onboarding();
  setTimeout(tick, 1200);
  setInterval(tick, 20000);
  setInterval(() => { if (ui.view === 'home' && !sheetOpen() && !rec && !document.hidden) render(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden){ tick(); if (!sheetOpen()) render(); } });
  window.addEventListener('pointerdown', () => { if (!soundUnlocked){ soundUnlocked = true; audioCtx(); } }, {once: true});
}
init();
})();
</script>
